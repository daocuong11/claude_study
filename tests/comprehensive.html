const GUIDE_URL = '../guide.html';

// Each question carries its own reference (ref.a = guide anchor, ref.t = section title).
const QUESTIONS = [
 {
  "label": "1",
  "domain": "Domain 1: Agentic Architecture & Orchestration",
  "q": "<p>You are building a coding agent that should keep working on a refactor until it is genuinely finished. Each turn you send the conversation to Claude with a set of tools. Which condition should drive whether your loop sends another request or returns the result to the user?</p>",
  "opts": [
   "Continue while <code>stop_reason</code> is <code>tool_use</code>; stop when it is <code>end_turn</code>.",
   "Continue until the assistant text no longer contains the phrase keep going.",
   "Stop as soon as any tool returns a successful result, since the work is then done.",
   "Continue until a fixed cap of 5 iterations is reached, then return whatever exists."
  ],
  "correct": 0,
  "expl": "<p>The agentic loop is driven by <code>stop_reason</code>: <code>tool_use</code> means Claude wants a tool executed and the result fed back, so the loop continues; <code>end_turn</code> means Claude considers the task complete. Parsing assistant text for phrases and using an arbitrary iteration cap as the primary stop condition are explicit anti-patterns. Stopping on the first successful tool result ends the loop prematurely, since most tasks require several tool calls before <code>end_turn</code>.</p>",
  "ref": {
   "a": "task-statement-11-design-and-implement-agentic-loops-for-autonomous-task-execution",
   "t": "Domain 1, Task Statement 1.1 — Design and implement agentic loops for autonomous task execution"
  }
 },
 {
  "label": "2",
  "domain": "Domain 1: Agentic Architecture & Orchestration",
  "q": "<p>A teammate's agent loop terminates by scanning the model's last message for the string Task completed. In production it sometimes stops mid-task and sometimes never stops. Why is this design flawed?</p>",
  "opts": [
   "Because <code>end_turn</code> is only emitted for chat, not for tool-using agents.",
   "Because parsing assistant text for a completion phrase is an unreliable signal; the structured <code>stop_reason</code> is the only dependable completion indicator.",
   "Because the model never writes free text once tools are attached, so the scan always fails.",
   "Because the loop should instead stop the first time <code>stop_reason</code> is <code>tool_use</code>."
  ],
  "correct": 1,
  "expl": "<p>Detecting completion by parsing assistant text (such as Task completed) is a named anti-pattern: the model may phrase things differently or include the phrase mid-task. The reliable signal is <code>stop_reason == end_turn</code>. <code>end_turn</code> is emitted for tool-using agents too. Stopping on <code>tool_use</code> would end the loop exactly when Claude wants to continue. The model can and does produce text alongside tool use, so the claim it never writes text is false.</p>",
  "ref": {
   "a": "task-statement-11-design-and-implement-agentic-loops-for-autonomous-task-execution",
   "t": "Domain 1, Task Statement 1.1 — Design and implement agentic loops for autonomous task execution"
  }
 },
 {
  "label": "3",
  "domain": "Domain 1: Agentic Architecture & Orchestration",
  "q": "<p>In your agent loop, after Claude returns a <code>tool_use</code> response and your code executes the tool, what must happen before the next request so that Claude can decide its next action?</p>",
  "opts": [
   "Discard the tool output and resend only the original user message to keep context small.",
   "Summarize the tool result into a single confidence score and pass only that score.",
   "Append the tool result to the conversation history and send it back on the next iteration.",
   "Replace the system prompt with the tool result so it takes priority."
  ],
  "correct": 2,
  "expl": "<p>Tool results must be appended to the conversation history so the model can use them to choose the next action; this is what makes the loop model-driven. Discarding the output strips the very information Claude needs to proceed. Collapsing the result into a single score loses the data the model reasons over. The tool result belongs in message history, not in the system prompt, which is a separate field carrying behavioral rules.</p>",
  "ref": {
   "a": "task-statement-11-design-and-implement-agentic-loops-for-autonomous-task-execution",
   "t": "Domain 1, Task Statement 1.1 — Design and implement agentic loops for autonomous task execution"
  }
 },
 {
  "label": "4",
  "domain": "Domain 1: Agentic Architecture & Orchestration",
  "q": "<p>An architect contrasts an agentic loop with a hard-coded decision tree that fires tools in a fixed order. What is the defining characteristic of the agentic-loop approach?</p>",
  "opts": [
   "The sequence of tool calls is fixed at design time and cannot vary per request.",
   "Tools are executed by the model itself rather than by your application code.",
   "The loop relies on <code>max_tokens</code> as its primary control signal.",
   "Claude chooses which tool to call next based on context and prior tool results."
  ],
  "correct": 3,
  "expl": "<p>The agentic loop is model-driven: Claude decides the next tool based on accumulated context and earlier results, unlike a hard-coded tree with a fixed sequence. The model does not execute tools; it emits a structured request and your code runs it. <code>max_tokens</code> governs truncation, not loop control; the loop is governed by <code>stop_reason</code> (<code>tool_use</code> vs <code>end_turn</code>).</p>",
  "ref": {
   "a": "task-statement-11-design-and-implement-agentic-loops-for-autonomous-task-execution",
   "t": "Domain 1, Task Statement 1.1 — Design and implement agentic loops for autonomous task execution"
  }
 },
 {
  "label": "5",
  "domain": "Domain 1: Agentic Architecture & Orchestration",
  "q": "<p>A response from Claude returns with <code>stop_reason</code> equal to <code>max_tokens</code> in the middle of a long agent run. What is the correct interpretation and action?</p>",
  "opts": [
   "The response was truncated at the token limit; the output is incomplete and you may need to raise the limit.",
   "Claude wants to call a tool; execute it and feed the result back.",
   "The task finished normally; show the result to the user and end the loop.",
   "A stop sequence was matched; branch on your application logic."
  ],
  "correct": 0,
  "expl": "<p><code>max_tokens</code> means the token limit was reached and the response is truncated, so it is incomplete and you may need to increase the limit. <code>end_turn</code> (not <code>max_tokens</code>) signals normal completion. <code>tool_use</code> signals a tool call. <code>stop_sequence</code> indicates a stop sequence was encountered. Confusing <code>max_tokens</code> with <code>end_turn</code> would cause you to surface a truncated answer as if it were finished.</p>",
  "ref": {
   "a": "task-statement-11-design-and-implement-agentic-loops-for-autonomous-task-execution",
   "t": "Domain 1, Task Statement 1.1 — Design and implement agentic loops for autonomous task execution"
  }
 },
 {
  "label": "6",
  "domain": "Domain 2: Tool Design & MCP Integration",
  "q": "<p>Your support agent occasionally returns plain conversational text instead of calling a structured extraction tool, and you need a guaranteed tool call. Separately, your agent loop must know when to keep iterating. Which pairing of fields is correct?</p>",
  "opts": [
   "Use <code>stop_reason</code> set to <code>any</code> to force a tool call, and use <code>tool_choice</code> to control loop continuation.",
   "Use <code>tool_choice</code> set to <code>any</code> to force a tool call, and use <code>stop_reason</code> to control loop continuation.",
   "Use <code>max_tokens</code> to force a tool call, and parse assistant text to control loop continuation.",
   "Use <code>tool_choice</code> set to <code>auto</code> to force a tool call, and an iteration cap to control loop continuation."
  ],
  "correct": 1,
  "expl": "<p><code>tool_choice: any</code> forces the model to call some tool, guaranteeing structured output, while <code>stop_reason</code> (<code>tool_use</code> vs <code>end_turn</code>) is the loop-control signal. <code>stop_reason</code> is a response field you read, not a request parameter you set, so it cannot force a tool call. <code>max_tokens</code> bounds length, not tool calling. <code>tool_choice: auto</code> lets the model answer in text, so it does not guarantee a call; and iteration caps and text parsing are loop anti-patterns.</p>",
  "ref": {
   "a": "task-statement-23-distribute-tools-appropriately-across-agents-and-configure-tool-choice",
   "t": "Domain 2, Task Statement 2.3 — Distribute tools appropriately across agents and configure tool choice"
  }
 },
 {
  "label": "7",
  "domain": "Domain 1: Agentic Architecture & Orchestration",
  "q": "<p>You are designing a multi-agent research system with a coordinator and several specialist subagents. In a hub-and-spoke topology, which responsibility belongs to the coordinator (the hub)?</p>",
  "opts": [
   "Letting subagents call one another directly to negotiate overlapping coverage.",
   "Sharing one global memory object that all subagents read from and write to between calls.",
   "Decomposing the task, delegating to subagents, aggregating and validating results, and handling errors and retries.",
   "Executing every tool itself and using subagents only as passive data stores."
  ],
  "correct": 2,
  "expl": "<p>In hub-and-spoke, the coordinator owns decomposition, delegation, dynamic subagent selection, result aggregation and validation, and error handling and retries. Subagents do not call each other; all communication flows through the coordinator for observability and error control. Subagents have isolated context and do not share memory across calls. Subagents do real work; treating them as passive stores defeats the purpose of delegation.</p>",
  "ref": {
   "a": "task-statement-12-orchestrate-multi-agent-systems-with-coordinator-subagent-patterns",
   "t": "Domain 1, Task Statement 1.2 — Orchestrate multi-agent systems with coordinator-subagent patterns"
  }

// ---------------- State ----------------
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);
// A question is "evaluated" (graded & locked) once it has been answered and the
// user has checked it (per-question) or run the global Evaluate. Unanswered
// questions stay answerable so the test can continue after a partial evaluation.
let evaluatedQ = new Array(QUESTIONS.length).fill(false);

const qgrid = document.getElementById('qgrid');
const qcard = document.getElementById('qcard');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const checkBtn = document.getElementById('checkBtn');
const progressText = document.getElementById('progressText');
const banner = document.getElementById('banner');

// ---------------- Sidebar ----------------
function buildSidebar() {
  qgrid.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const btn = document.createElement('button');
    btn.className = 'qbtn';
    btn.id = 'qbtn-' + i;
    btn.innerHTML = q.label + '<span class="mark"></span>';
    btn.onclick = () => showQuestion(i);
    qgrid.appendChild(btn);
  });
}

function refreshSidebar() {
  QUESTIONS.forEach((q, i) => {
    const btn = document.getElementById('qbtn-' + i);
    btn.classList.toggle('current', i === current);
    btn.classList.toggle('answered', !evaluatedQ[i] && answers[i] !== null);
    btn.classList.remove('result-correct', 'result-wrong', 'result-skipped');
    const mark = btn.querySelector('.mark');
    mark.textContent = '';
    if (evaluatedQ[i]) {
      if (answers[i] === q.correct) {
        btn.classList.add('result-correct');
        mark.textContent = '✓';
      } else {
        btn.classList.add('result-wrong');
        mark.textContent = '✗';
      }
    }
  });
}

// ---------------- Question rendering ----------------
function showQuestion(i) {
  current = i;
  const q = QUESTIONS[i];
  const qEval = evaluatedQ[i];
  const letters = ['A', 'B', 'C', 'D'];

  let html = '<div class="qmeta"><span>Question ' + q.label + ' &nbsp;·&nbsp; ' + (i + 1) + ' of ' + QUESTIONS.length + '</span>' +
             (q.domain ? '<span class="domain">' + q.domain + '</span>' : '') + '</div>';
  html += '<div class="qtext">' + q.q + '</div>';
  html += '<div class="options">';
  q.opts.forEach((opt, oi) => {
    let cls = 'option';
    let tag = '';
    if (!qEval && answers[i] === oi) cls += ' selected';
    if (qEval) {
      if (oi === q.correct) {
        cls += ' is-correct';
        tag = '<span class="tag correct">' + (answers[i] === oi ? 'Your answer ✓' : 'Correct answer') + '</span>';
      } else if (answers[i] === oi) {
        cls += ' is-wrong';
        tag = '<span class="tag yours">Your answer</span>';
      }
    }
    html += '<div class="' + cls + '" onclick="selectOption(' + oi + ')">' +
            '<span class="letter">' + letters[oi] + '</span><span>' + opt + '</span>' + tag + '</div>';
  });
  html += '</div>';
  const ref = q.ref;
  const refHtml = ref
    ? '<div class="source">📖 Full details: <a href="' + GUIDE_URL + '#' + ref.a + '" target="_blank" rel="noopener">' + ref.t + '</a></div>'
    : '';
  html += '<div class="explanation"><h3>Explanation — Correct answer: ' + letters[q.correct] + '</h3>' + q.expl + refHtml + '</div>';

  qcard.innerHTML = html;
  qcard.classList.toggle('evaluated', qEval);

  prevBtn.disabled = (i === 0);
  const isLast = (i === QUESTIONS.length - 1);
  nextBtn.textContent = 'Next →';
  nextBtn.disabled = isLast;
  updateCheckBtn();

  const answeredCount = answers.filter(a => a !== null).length;
  progressText.textContent = answeredCount + ' of ' + QUESTIONS.length + ' answered';

  refreshSidebar();
  document.getElementById('main').scrollTop = 0;
}

function selectOption(oi) {
  if (evaluatedQ[current]) return; // graded questions are locked
  answers[current] = oi;
  updateEvaluateBtn();
  showQuestion(current);
}

function goPrev() {
  if (current > 0) showQuestion(current - 1);
}

function goNext() {
  if (current < QUESTIONS.length - 1) showQuestion(current + 1);
}

// ---------------- Per-question check ----------------
// The Check Answer button grades ONLY the current question (validate before Next).
function updateCheckBtn() {
  if (evaluatedQ[current]) {
    checkBtn.textContent = 'Checked ✓';
    checkBtn.disabled = true;
    checkBtn.classList.remove('check');
    checkBtn.classList.add('checked');
  } else {
    checkBtn.textContent = 'Check Answer';
    checkBtn.disabled = (answers[current] === null);
    checkBtn.classList.add('check');
    checkBtn.classList.remove('checked');
  }
}

function checkCurrent() {
  if (evaluatedQ[current] || answers[current] === null) return;
  evaluatedQ[current] = true;
  updateStats();
  updateEvaluateBtn();
  showQuestion(current);
}

// Global Evaluate is enabled whenever at least one answered question hasn't been graded yet.
function updateEvaluateBtn() {
  const pending = QUESTIONS.some((q, i) => answers[i] !== null && !evaluatedQ[i]);
  document.getElementById('evaluateBtn').disabled = !pending;
}

// Recompute header stats and banner over all graded questions.
function updateStats() {
  let correct = 0, wrong = 0, graded = 0;
  QUESTIONS.forEach((q, i) => {
    if (!evaluatedQ[i]) return;
    graded++;
    if (answers[i] === q.correct) correct++; else wrong++;
  });
  const accuracy = graded > 0 ? Math.round((correct / graded) * 100) : 0;

  document.getElementById('statCorrect').textContent = graded ? correct : '–';
  document.getElementById('statWrong').textContent = graded ? wrong : '–';
  document.getElementById('statAccuracy').textContent = graded ? accuracy + '%' : '–';

  if (graded === 0) { banner.className = 'banner'; return; }
  const remaining = QUESTIONS.length - graded;
  banner.className = 'banner show ' + (accuracy >= 72 ? 'good' : 'bad');
  banner.textContent = (accuracy >= 72 ? '🎉 ' : '📚 ') +
    'Checked ' + graded + ' of ' + QUESTIONS.length + ' question(s): ' +
    correct + ' correct, ' + wrong + ' wrong — ' + accuracy + '% accuracy. ' +
    (remaining > 0
      ? remaining + ' question(s) still open — check them individually or click Evaluate All.'
      : (accuracy >= 72 ? 'That clears the ~72% passing bar!' : 'The real exam passing score is 720/1000 (~72%). Review the explanations below.')) +
    ' Click any question to review.';
}

// ---------------- Global evaluation ----------------
function evaluateTest() {
  // Grade all answered-but-not-yet-graded questions at once.
  const pending = [];
  QUESTIONS.forEach((q, i) => {
    if (answers[i] !== null && !evaluatedQ[i]) pending.push(i);
  });
  if (pending.length === 0) {
    alert('There are no newly answered questions to evaluate.');
    return;
  }
  pending.forEach(i => { evaluatedQ[i] = true; });

  updateStats();
  updateEvaluateBtn();
  showQuestion(current);
}

function resetTest() {
  if (!confirm('Reset the test? All answers will be cleared.')) return;
  answers = new Array(QUESTIONS.length).fill(null);
  evaluatedQ = new Array(QUESTIONS.length).fill(false);
  updateStats();
  updateEvaluateBtn();
  banner.className = 'banner';
  showQuestion(0);
}

// ---------------- Keyboard ----------------
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) goNext();
  if (e.key === 'ArrowLeft' && !prevBtn.disabled) goPrev();
  if (e.key === 'Enter' && !checkBtn.disabled) { checkCurrent(); return; }
  if (!evaluatedQ[current] && ['a','b','c','d'].includes(e.key.toLowerCase())) {
    selectOption(['a','b','c','d'].indexOf(e.key.toLowerCase()));
  }
});

// ---------------- Init ----------------
buildSidebar();
updateEvaluateBtn();
showQuestion(0);
</script> </body> </html>
